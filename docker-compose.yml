version: '3.8'
services:
  backend:
    build: ./backend
    # Use uvicorn directly with a high timeout
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300
    ports:
      - "8000:8000"
    environment:
      - GROK_API_KEY=xai-your-api-key-here
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

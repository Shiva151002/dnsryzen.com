name: Deploy dnsryzen.com to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to the dnsryzen folder
            cd /opt/dnsryzen.com/
            
            # Pull the latest code
            sudo git pull origin main
            
            # Kill any processes using ports 8000 and 5173
            sudo lsof -ti :8000 | xargs -r sudo kill -9
            sudo lsof -ti :5173 | xargs -r sudo kill -9
            
            # Stop and remove old containers
            sudo docker compose down -v
            
            # Clean up unused Docker resources
            sudo docker system prune -f
            
            # Wait a moment for ports to fully release
            sleep 2
            
            # Build and start the new containers
            sudo docker compose up -d --build

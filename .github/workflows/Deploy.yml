name: Deploy dnsryzen.com to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to the /opt directory
            cd /opt/
            
            # 1. If folder is missing, clone it using the built-in GitHub Token
            if [ ! -d "dnsryzen.com" ]; then
              echo "Folder missing! Cloning from GitHub..."
              sudo git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/Shiva151002/dnsryzen.com.git dnsryzen.com
            fi
            
            # Go into the folder
            cd /opt/dnsryzen.com/
            
            # 2. Update the git URL to use the token so 'git pull' never asks for a password
            sudo git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/Shiva151002/dnsryzen.com.git
            
            # 3. Pull the latest code
            sudo git pull origin main
            
            # 4. Stop old containers (the || true prevents errors if no containers are running)
            sudo docker compose down || true
            
            # 5. Build and start new containers
            sudo docker compose up -d --build

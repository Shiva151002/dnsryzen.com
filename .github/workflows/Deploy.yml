name: Deploy dnsryzen.com to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to the /opt directory
            cd /opt/
            
            # Check if the folder exists. If not, clone it!
            if [ ! -d "dnsryzen.com" ]; then
              echo "Folder missing! Cloning from GitHub..."
              # Note: If your repo is private, this line will need a Personal Access Token
              sudo git clone https://github.com/Shiva151002/dnsryzen.com.git dnsryzen.com
            fi
            
            # Go into the folder
            cd /opt/dnsryzen.com/
            
            # Pull the latest code (in case the folder already existed)
            sudo git pull origin main
            
            # Stop and remove old containers
            sudo docker compose down
            
            # Build and start the new containers
            sudo docker compose up -d --build

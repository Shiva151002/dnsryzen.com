name: Deploy dnsryzen.com to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to the /opt directory
            cd /opt/
            
            # If the dnsryzen.com folder does NOT exist, clone it from GitHub
            if [ ! -d "dnsryzen.com" ]; then
              echo "Folder not found. Cloning from GitHub..."
              sudo git clone https://github.com/Shiva151002/dnsryzen.com.git dnsryzen.com
            fi
            
            # Go into the folder
            cd /opt/dnsryzen.com/
            
            # Pull the latest code just to be safe
            sudo git pull origin main
            
            # Stop any old containers that might be lingering
            sudo docker compose down || true
            
            # Build and start the new containers
            sudo docker compose up -d --build
